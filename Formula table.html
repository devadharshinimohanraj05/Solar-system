<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formula Table</title>
    <link rel="icon" href="./sources/Mathematics logo.jpg">
    <h2><center>Mathematics Formulabar</center></h2>
</head>
<body>
    <center>
        <table border="2" cellpadding="10" cellspacing="1" bgcolor="pink">
            <caption>3D Shapes</caption>
            <tr bgcolor="yellow">
                <b><th>Name of the Solid</th>
                <th>Figure</th>
                <th>Volume</th>
                <th>Lateral/Curved surface area</th>
                <th>Total Surface area</th></b>
            </tr>

            <tr>
                <td>Cuboid</td>
                <td><img src="./sources/Cuboid.jpeg" height="100" width="100"></td>  
                <td>lbh</td>
                <td>2h(l+b)</td>
                <td>2(lb+bh+hl)</td>
            </tr>

            <tr>
                <td>Cube</td>
                <td><img src="./sources/Cube.jpeg" height="100" width="100"></td>
                <td>a<sup>2</sup></td>
                <td>4a<sup>2</sup></td>
                <td>6a<sup>2</sup></td>
            </tr>

            <tr>
                <td>Right Circular Cylinder</td>
                <td><img src="./sources/Right Circular Cylinder.jpeg" height="100" width="100"> </td>
                <td>πr<sup>2</sup>h</td>
                <td>2πrh</td>
                <td>2πr(r+h)</td>
            </tr>

            <tr>
                <td>Right Circular Cone</td>
                <td><img src="./sources/Right Circular Cone.jpeg" height="100" width="100"></td>
                <td>1/3πr<sup>2</sup>h</td>
                <td>πrl</td>
                <td>πr(r+l)</td>
            </tr>

            <tr>
                <td>Sphere</td>
                <td><img src="./sources/Sphere.jpeg" height="100" width="100"></td>
                <td>4/3πr<sup>3</sup></td>
                <td>4πr<sup>2</sup></td>
                <td>4πr<sup>2</sup></td>
            </tr>

            <tr>
                <td>Hemisphere</td>
                <td><img src="./sources/Hemisphere.jpeg" height="100" width="100"></td>
                <td>2/3πr<sup>3</sup></td>
                <td>2πr<sup>2</sup></td>
                <td>3πr<sup>2</sup></td>
            </tr>
</table>
</body>
</html>
